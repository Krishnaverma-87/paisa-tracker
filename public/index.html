<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paisa</title>
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1c2826;--mute:#6b7a77;--line:#e1e6e4;--acc:#0f6b5c;--out:#c2410c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top div{max-width:1080px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:20px;letter-spacing:-.3px}.brand b{color:var(--acc)}
.sp{flex:1}
.mo{display:flex;align-items:center;gap:4px;font-weight:600}
.mo button{border:1px solid var(--line);background:var(--card);width:30px;height:30px;cursor:pointer;border-radius:4px;font-size:16px}
.mo span{min-width:130px;text-align:center}
.b{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:4px;cursor:pointer;font:inherit}
.b.p{background:var(--acc);border-color:var(--acc);color:#fff}.b:hover{filter:brightness(.95)}
main{max-width:1080px;margin:auto;padding:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media(max-width:820px){.s2,.s3,.s4{grid-column:span 6}}
h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--mute);text-transform:none}
.big{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0}
.in{color:var(--acc)}.out{color:var(--out)}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.lg div{display:flex;align-items:center;gap:8px;font-size:13px;margin:3px 0}.lg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.lg span{margin-left:auto;padding-left:14px;color:var(--mute)}
.bud{margin:10px 0}.bud .h{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.bud input{width:78px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;font:inherit;font-size:13px;text-align:right}
.trk{height:7px;background:#e9eeec;border-radius:4px;margin-top:5px;overflow:hidden}.trk div{height:100%;background:var(--acc)}
.trk.over div{background:var(--out)}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
input,select,textarea{padding:8px 10px;border:1px solid #cfd8d5;border-radius:4px;font:inherit;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{outline:2px solid #9ccfc5;border-color:var(--acc)}
.tools input{flex:1;min-width:160px;width:auto}.tools select{width:150px}
table{width:100%;border-collapse:collapse}th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}td.r,th.r{text-align:right}
td small{display:block;color:var(--mute);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#eef2f0}
.act button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:12px;padding:2px 6px}.act button:hover{color:var(--acc);text-decoration:underline}
dialog{border:1px solid var(--line);border-radius:8px;padding:22px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(20,30,28,.35)}
dialog h2{margin:0 0 6px;font-size:18px}dialog label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px}
.seg{display:flex}.seg button{flex:1;padding:8px;border:1px solid #cfd8d5;background:#fff;cursor:pointer;font:inherit}
.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0;border-left:0}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.er{color:var(--out);font-size:13px;min-height:20px;margin-top:8px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);padding:14px 0;text-align:center}
</style></head><body>
<div class="top"><div>
 <div class="brand" style="padding:0">Pai<b>sa</b></div>
 <div class="mo" style="padding:0"><button id="prev">&lsaquo;</button><span id="mlabel"></span><button id="next">&rsaquo;</button></div>
 <div class="sp"></div>
 <a class="b" href="/api/export" style="text-decoration:none">Export CSV</a>
 <button class="b p" id="new">+ Add transaction</button>
</div></div>

<main>
 <div class="card s2"><h3>Income</h3><p class="big in" id="inc">0</p></div>
 <div class="card s2"><h3>Spent</h3><p class="big out" id="spent">0</p></div>
 <div class="card s2"><h3>Balance this month</h3><p class="big" id="bal">0</p></div>

 <div class="card s3"><h3>Where the money went</h3><div class="dn" id="donut"></div></div>
 <div class="card s3"><h3>Last 6 months</h3><div id="trend"></div></div>

 <div class="card s2"><h3>Monthly budgets <span style="font-weight:400">(type a limit)</span></h3><div id="buds"></div></div>
 <div class="card s4"><h3>Transactions</h3>
  <div class="tools"><input id="q" placeholder="Search title or note"><select id="f"></select></div>
  <div id="list"></div></div>
</main>

<dialog id="dlg"><h2 id="dt">Add transaction</h2>
 <div class="seg" style="margin-top:10px"><button type="button" id="tx" class="on">Expense</button><button type="button" id="ti">Income</button></div>
 <label>Title</label><input id="title" placeholder="e.g. Canteen lunch" maxlength="40">
 <div class="row2"><div><label>Amount (INR)</label><input id="amount" inputmode="decimal" placeholder="0"></div>
 <div><label>Date</label><input id="date" type="date"></div></div>
 <div id="catw"><label>Category</label><select id="category"></select></div>
 <label>Note (optional)</label><input id="note" maxlength="120">
 <div class="er" id="err"></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="b" id="cancel">Cancel</button><button class="b p" id="save">Save</button></div>
</dialog>

<script>
const CATS=['Food','Travel','Study','Bills','Fun','Health','Other'];
const COL={Food:'#d99a1e',Travel:'#2d7fa3',Study:'#7a5aa6',Bills:'#c2410c',Fun:'#3f8f4f',Health:'#c0456b',Other:'#8a9693',Income:'#0f6b5c'};
const $=id=>document.getElementById(id);
const inr=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const api=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
const TITLE_RE=/^[A-Za-z0-9 .,&'-]{2,40}$/;
let month=new Date().toISOString().slice(0,7), items=[], budgets={}, S=null, type='expense', editId=null;

const mname=m=>{const[y,n]=m.split('-');return new Date(y,n-1).toLocaleString('en-IN',{month:'long',year:'numeric'})};
const shift=n=>{const[y,m]=month.split('-').map(Number);const d=new Date(y,m-1+n,1);month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');load()};

async function load(){
  $('mlabel').textContent=mname(month);
  try{
    [S,items]=await Promise.all([api('/api/summary?month='+month).then(r=>r.json()),api('/api/expenses?month='+month).then(r=>r.json())]);
    budgets={};(await api('/api/budgets').then(r=>r.json())).forEach(b=>budgets[b.category]=b.limit);
  }catch(e){$('list').innerHTML='<div class="empty">Cannot reach the server.</div>';return}
  paint();
}
function paint(){
  $('inc').textContent=inr(S.income);$('spent').textContent=inr(S.spent);
  const bal=S.income-S.spent;$('bal').textContent=inr(bal);$('bal').className='big '+(bal>=0?'in':'out');
  donut();trend();buds();list();
}
function donut(){
  const ents=Object.entries(S.byCat).sort((a,b)=>b[1]-a[1]),tot=S.spent;
  if(!tot){$('donut').innerHTML='<div class="empty" style="width:100%">No spending recorded this month.</div>';return}
  let off=0,arcs='';
  ents.forEach(([c,v])=>{const p=v/tot*100;arcs+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${COL[c]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p});
  $('donut').innerHTML=`<svg width="150" height="150" viewBox="0 0 42 42">${arcs}<text x="21" y="22.5" text-anchor="middle" font-size="4.2" font-weight="700" fill="#1c2826">${inr(tot)}</text></svg>
  <div class="lg" style="flex:1;min-width:140px">${ents.map(([c,v])=>`<div><i style="background:${COL[c]}"></i>${c}<span>${Math.round(v/tot*100)}%</span></div>`).join('')}</div>`;
}
function trend(){
  const mx=Math.max(1,...S.trend.flatMap(t=>[t.income,t.spent])),H=120;let g='';
  S.trend.forEach((t,i)=>{const x=i*58+10,hi=t.income/mx*H,hs=t.spent/mx*H;
    g+=`<rect x="${x}" y="${H-hi+8}" width="20" height="${hi}" fill="#0f6b5c" rx="2"/><rect x="${x+22}" y="${H-hs+8}" width="20" height="${hs}" fill="#c2410c" rx="2"/>
    <text x="${x+21}" y="${H+24}" text-anchor="middle" font-size="10" fill="#6b7a77">${new Date(t.m+'-01').toLocaleString('en-IN',{month:'short'})}</text>`});
  $('trend').innerHTML=`<svg viewBox="0 0 360 150" width="100%">${g}</svg>
  <div class="lg" style="display:flex;gap:16px;font-size:12px"><div><i style="background:#0f6b5c"></i>Income</div><div><i style="background:#c2410c"></i>Spent</div></div>`;
}
function buds(){
  $('buds').innerHTML=CATS.map(c=>{const sp=S.byCat[c]||0,lim=budgets[c]||0,p=lim?Math.min(100,sp/lim*100):0;
    return `<div class="bud"><div class="h"><span>${c} <span style="color:var(--mute)">${inr(sp)}</span></span>
    <input type="number" min="0" placeholder="limit" value="${lim||''}" data-c="${c}"></div>
    ${lim?`<div class="trk ${sp>lim?'over':''}"><div style="width:${p}%"></div></div>`:''}</div>`}).join('');
}
function list(){
  const q=$('q').value.toLowerCase(),f=$('f').value;
  const rows=items.filter(x=>(f==='All'||x.category===f)&&(x.title+' '+x.note).toLowerCase().includes(q));
  $('list').innerHTML=rows.length?`<table><tr><th>Details</th><th>Category</th><th class="r">Amount</th><th></th></tr>`+rows.map(x=>`
   <tr><td>${esc(x.title)}<small>${x.date}${x.note?' &middot; '+esc(x.note):''}</small></td>
   <td><span class="chip" style="color:${COL[x.category]}">${x.category}</span></td>
   <td class="r ${x.type==='income'?'in':''}">${x.type==='income'?'+':'-'}${inr(x.amount)}</td>
   <td class="act r"><button data-e="${x._id}">edit</button><button data-d="${x._id}">delete</button></td></tr>`).join('')+'</table>'
   :'<div class="empty">No transactions to show.</div>';
}

// ---- modal ----
function setType(t){type=t;$('tx').classList.toggle('on',t==='expense');$('ti').classList.toggle('on',t==='income');$('catw').style.display=t==='expense'?'block':'none'}
function openDlg(x){
  editId=x?x._id:null;$('dt').textContent=x?'Edit transaction':'Add transaction';$('err').textContent='';
  setType(x?x.type:'expense');$('title').value=x?x.title:'';$('amount').value=x?x.amount:'';
  $('date').value=x?x.date:new Date().toISOString().slice(0,10);$('note').value=x?x.note:'';
  if(x&&x.type==='expense')$('category').value=x.category;$('dlg').showModal();
}
async function save(){
  const d={type,title:$('title').value.trim(),amount:Number($('amount').value),category:$('category').value,date:$('date').value,note:$('note').value.trim()};
  if(!TITLE_RE.test(d.title))return $('err').textContent="Title: 2-40 characters, letters/numbers and . , & ' - only";
  if(!(d.amount>0))return $('err').textContent='Enter an amount greater than 0';
  if(!d.date)return $('err').textContent='Pick a date';
  const r=await (editId?api('/api/expenses/'+editId,'PUT',d):api('/api/expenses','POST',d));
  if(!r.ok)return $('err').textContent=(await r.json()).error;
  $('dlg').close();if(d.date.slice(0,7)!==month)month=d.date.slice(0,7);load();
}

$('category').innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
$('f').innerHTML=['All',...CATS,'Income'].map(c=>`<option>${c}</option>`).join('');
$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);
$('new').onclick=()=>openDlg();$('cancel').onclick=()=>$('dlg').close();$('save').onclick=save;
$('tx').onclick=()=>setType('expense');$('ti').onclick=()=>setType('income');
$('q').oninput=$('f').onchange=list;
$('list').onclick=async e=>{
  if(e.target.dataset.e)openDlg(items.find(x=>x._id===e.target.dataset.e));
  if(e.target.dataset.d&&confirm('Delete this transaction?')){await api('/api/expenses/'+e.target.dataset.d,'DELETE');load()}
};
$('buds').onchange=async e=>{await api('/api/budgets','PUT',{category:e.target.dataset.c,limit:e.target.value});load()};
load();
</script></body></html>
